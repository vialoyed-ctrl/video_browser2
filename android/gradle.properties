# 内存上限从 Flutter 模板默认的 -Xmx8G / 4G Metaspace 下调。
# 原因：本机物理内存 16GB，空闲常低于 5GB，8G 堆 + 4G Metaspace 的请求
# 会让 Gradle daemon 在构建中途被系统回收，表现为"构建日志无 FAILURE 段、
# daemon 日志戛然而止、退出码 1"。3G/1G 足够完成本工程规模的构建。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1G
kotlin.compiler.execution.strategy=in-process

# 关闭 Kotlin 增量编译。
# 原因：多次被中断的构建留下了损坏的增量缓存，报
# "Could not close incremental caches in .../caches-jvm/jvm/kotlin"。
# 该缓存对构建速度有影响但非必需，关闭后稳定性优先。
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
